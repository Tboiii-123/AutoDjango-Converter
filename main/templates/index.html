<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML to Django Converter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-lg p-4">
        <h2 class="text-center mb-4 text-primary">HTML to Django Template Converter</h2>

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label for="html_input" class="form-label">Paste your HTML:</label>
                <textarea class="form-control" name="html_input" rows="10" placeholder="Paste your HTML here..." required></textarea>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-primary">Convert to Django</button>
            </div>
        </form>
        {% if converted_html %}
        <div class="mt-5">
            <h5 class="text-success">Converted Django Template:</h5>
        
            <div class="position-relative">
                <button class="btn btn-sm btn-outline-light position-absolute top-0 end-0 m-2" onclick="copyToClipboard()">
                    Copy
                </button>
        
                <pre id="convertedOutput" class="bg-dark text-white p-3 rounded" style="white-space: pre-wrap;"><code>{{ converted_html|escape }}</code></pre>

            </div>
        </div>
        {% endif %}
        
    </div>
</div>

</body>

<script>
    function copyToClipboard() {
        const codeBlock = document.getElementById("convertedOutput");
        const range = document.createRange();
        range.selectNodeContents(codeBlock);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
    
        try {
            const successful = document.execCommand('copy');
            if (successful) {
                alert("Copied to clipboard!");
            } else {
                alert("Copy failed. Please try manually.");
            }
        } catch (err) {
            alert("Copy not supported in this browser.");
        }
    
        selection.removeAllRanges();
    }
    
    </script>

</html>
